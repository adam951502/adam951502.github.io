<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PSA and SNKRDUNK card price automation</title>
  <desc id="desc">Abstract trading-card data pipeline with card code, verified mapping, live price and Telegram delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16191f"/>
      <stop offset="1" stop-color="#303641"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#e6c98f"/>
      <stop offset="1" stop-color="#b9d7d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="44" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".12">
    <path d="M0 150H1200M0 360H1200M0 570H1200"/>
    <path d="M220 0V720M600 0V720M980 0V720"/>
  </g>
  <rect x="92" y="92" width="330" height="500" rx="28" fill="#f5f0e7"/>
  <rect x="120" y="126" width="274" height="260" rx="18" fill="#d9dde3"/>
  <circle cx="257" cy="256" r="72" fill="#aeb8c4"/>
  <path d="M198 280l42-48 38 34 38-44 48 58" fill="none" stroke="#788594" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="120" y="420" width="190" height="20" rx="10" fill="#737f8b"/>
  <rect x="120" y="460" width="240" height="14" rx="7" fill="#b0b6bd"/>
  <rect x="120" y="492" width="216" height="14" rx="7" fill="#b0b6bd"/>
  <rect x="120" y="536" width="126" height="34" rx="17" fill="#222831"/>
  <text x="183" y="559" fill="#f5f0e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="middle">PSA 10</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="500" y="140" fill="#f7f3eb" font-size="28" font-weight="700">CARD PRICE ROUTER</text>
    <text x="500" y="184" fill="#aeb7c2" font-size="18">series/card code → verified mapping → live market price</text>

    <rect x="500" y="236" width="240" height="76" rx="18" fill="#20252d" stroke="#e6c98f" stroke-opacity=".7"/>
    <text x="620" y="266" fill="#aeb7c2" font-size="14" text-anchor="middle">INPUT</text>
    <text x="620" y="292" fill="#f7f3eb" font-size="22" font-weight="700" text-anchor="middle">SV5K 088</text>

    <path d="M752 274H824" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M812 260l18 14-18 14" fill="none" stroke="#b9d7d0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="844" y="236" width="250" height="76" rx="18" fill="#20252d" stroke="#b9d7d0" stroke-opacity=".7"/>
    <text x="969" y="266" fill="#aeb7c2" font-size="14" text-anchor="middle">CANONICAL CARD</text>
    <text x="969" y="292" fill="#f7f3eb" font-size="20" font-weight="700" text-anchor="middle">SNKRDUNK ID</text>

    <rect x="500" y="360" width="594" height="132" rx="24" fill="#f5f0e7"/>
    <text x="534" y="401" fill="#666f7a" font-size="15">LIVE CONDITION PRICE</text>
    <text x="534" y="455" fill="#1d2229" font-size="42" font-weight="800">PSA 10  →  MARKET</text>
    <circle cx="1027" cy="426" r="34" fill="#1d2229"/>
    <path d="M1010 426h34M1027 409v34" stroke="#e6c98f" stroke-width="5" stroke-linecap="round"/>

    <rect x="500" y="536" width="278" height="76" rx="20" fill="#20252d"/>
    <text x="639" y="567" fill="#aeb7c2" font-size="14" text-anchor="middle">DELIVERY</text>
    <text x="639" y="592" fill="#f7f3eb" font-size="20" font-weight="700" text-anchor="middle">TELEGRAM / CLI</text>

    <rect x="806" y="536" width="288" height="76" rx="20" fill="#20252d"/>
    <text x="950" y="567" fill="#aeb7c2" font-size="14" text-anchor="middle">SAFETY</text>
    <text x="950" y="592" fill="#f7f3eb" font-size="19" font-weight="700" text-anchor="middle">CACHE + REVIEW</text>
  </g>
</svg>