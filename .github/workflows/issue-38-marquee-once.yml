name: Implement affiliation marquee once

on:
  push:
    branches:
      - agent/issue-38-affiliation-marquee

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-38-affiliation-marquee

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Implement marquee and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          index_path = Path("index.html")
          index = index_path.read_text()

          pattern = re.compile(
              r'(?P<indent>\s*)<div class="signature-list">\s*'
              r'<span>Fraunhofer EMI</span>\s*'
              r'<span>Aurore Collection</span>\s*'
              r'<span>University of Freiburg</span>\s*'
              r'<span>NTUST</span>\s*'
              r'<span>Chang Gung University</span>\s*'
              r'</div>'
          )
          match = pattern.search(index)
          if not match:
              raise SystemExit("Static Selected contexts block not found")

          indent = match.group("indent")
          child = indent + "  "
          grandchild = child + "  "
          great = grandchild + "  "
          deepest = great + "  "
          new_contexts = f'''{indent}<div class="affiliation-marquee" aria-label="Professional and research contexts">
          {child}<div class="affiliation-marquee__track">
          {grandchild}<div class="affiliation-marquee__group" role="list">
          {great}<div class="affiliation-item" role="listitem" title="Fraunhofer Institute for High-Speed Dynamics, Ernst-Mach-Institut">
          {deepest}<img src="assets/images/emi-color.svg" alt="Fraunhofer EMI" loading="lazy">
          {great}</div>
          {great}<div class="affiliation-item affiliation-item--relationship" role="listitem" title="cytena Bioprocess Solutions, now Leadgene Biosolutions">
          {deepest}<img src="assets/images/cropped-Logotype_RGB_Cytena_Color.webp" alt="cytena Bioprocess Solutions" loading="lazy">
          {deepest}<span class="affiliation-note">now Leadgene Biosolutions</span>
          {great}</div>
          {great}<div class="affiliation-item" role="listitem" title="National Taiwan University of Science and Technology (Taiwan Tech)">
          {deepest}<img src="assets/images/NTUST_logo.png" alt="Taiwan Tech" loading="lazy">
          {great}</div>
          {great}<div class="affiliation-item" role="listitem" title="Institute for Sustainable Systems Engineering (INATECH)">
          {deepest}<img src="assets/images/inatech_long.png" alt="INATECH" loading="lazy">
          {great}</div>
          {great}<div class="affiliation-item" role="listitem" title="HERAKLION research project">
          {deepest}<span class="affiliation-wordmark" aria-label="HERAKLION">HERAKLION</span>
          {great}</div>
          {great}<div class="affiliation-item" role="listitem" title="Aurore Collection">
          {deepest}<img src="assets/images/aurore_co.png" alt="Aurore Collection" loading="lazy">
          {great}</div>
          {grandchild}</div>
          {grandchild}<div class="affiliation-marquee__group" aria-hidden="true">
          {great}<div class="affiliation-item"><img src="assets/images/emi-color.svg" alt="" loading="lazy"></div>
          {great}<div class="affiliation-item affiliation-item--relationship">
          {deepest}<img src="assets/images/cropped-Logotype_RGB_Cytena_Color.webp" alt="" loading="lazy">
          {deepest}<span class="affiliation-note">now Leadgene Biosolutions</span>
          {great}</div>
          {great}<div class="affiliation-item"><img src="assets/images/NTUST_logo.png" alt="" loading="lazy"></div>
          {great}<div class="affiliation-item"><img src="assets/images/inatech_long.png" alt="" loading="lazy"></div>
          {great}<div class="affiliation-item"><span class="affiliation-wordmark">HERAKLION</span></div>
          {great}<div class="affiliation-item"><img src="assets/images/aurore_co.png" alt="" loading="lazy"></div>
          {grandchild}</div>
          {child}</div>
          {indent}</div>'''
          index = pattern.sub(lambda _: new_contexts, index, count=1)
          index = index.replace('aria-label="Selected contexts"', 'aria-label="Experience across research and industry"', 1)
          index = index.replace('>Selected contexts</p>', '>Experience across research &amp; industry</p>', 1)
          index = index.replace('>Blending research rigor, production delivery, and business execution.</p>', '>Organizations and research ecosystems from my professional journey.</p>', 1)
          index_path.write_text(index)

          translations = {
              "assets/i18n/en.json": {
                  "hero.aside.title": "Experience across research & industry",
                  "hero.aside.body": "Organizations and research ecosystems from my professional journey."
              },
              "assets/i18n/zh.json": {
                  "hero.aside.title": "跨研究與產業經歷",
                  "hero.aside.body": "來自職涯、研究與產品實作歷程中的機構與產業生態系。"
              }
          }
          for filename, updates in translations.items():
              path = Path(filename)
              payload = json.loads(path.read_text())
              payload.update(updates)
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")

          css_path = Path("assets/css/style.css")
          css = css_path.read_text()
          css_marker = "/* Issue #38: continuous affiliation marquee */"
          if css_marker in css:
              raise SystemExit("Affiliation marquee CSS already present")
          css_addition = r'''

          /* Issue #38: continuous affiliation marquee */
          .affiliation-marquee {
            position: relative;
            min-width: 0;
            overflow: hidden;
            padding: 10px 0;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
          }

          .affiliation-marquee__track {
            display: flex;
            width: max-content;
            will-change: transform;
            animation: affiliation-marquee-right 36s linear infinite;
          }

          .affiliation-marquee:hover .affiliation-marquee__track {
            animation-play-state: paused;
          }

          .affiliation-marquee__group {
            display: flex;
            align-items: center;
            gap: clamp(34px, 4vw, 62px);
            padding-right: clamp(34px, 4vw, 62px);
          }

          .affiliation-item {
            min-width: 154px;
            height: 72px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 10px;
            opacity: 0.64;
            transition: opacity 0.22s ease, transform 0.22s ease;
          }

          .affiliation-item img {
            width: auto;
            max-width: 178px;
            max-height: 38px;
            object-fit: contain;
            filter: grayscale(1) saturate(0.25);
            transition: filter 0.24s ease, opacity 0.24s ease;
          }

          .affiliation-item--relationship {
            min-width: 250px;
          }

          .affiliation-note {
            max-width: 104px;
            color: var(--muted-soft);
            font-family: var(--font-mono);
            font-size: 0.62rem;
            line-height: 1.25;
            letter-spacing: 0.04em;
          }

          .affiliation-wordmark {
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
          }

          .affiliation-item:hover {
            opacity: 1;
            transform: translateY(-1px);
          }

          .affiliation-item:hover img {
            filter: grayscale(0) saturate(1);
          }

          :root[data-theme="dark"] .affiliation-item img {
            filter: grayscale(1) brightness(1.5) contrast(0.9) saturate(0.2);
          }

          :root[data-theme="dark"] .affiliation-item:hover img {
            filter: grayscale(0) brightness(1.08) saturate(1);
          }

          @keyframes affiliation-marquee-right {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
          }

          @media (max-width: 640px) {
            .affiliation-marquee {
              -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            }

            .affiliation-marquee__track { animation-duration: 32s; }

            .affiliation-marquee__group {
              gap: 28px;
              padding-right: 28px;
            }

            .affiliation-item {
              min-width: 136px;
              height: 62px;
            }

            .affiliation-item img {
              max-width: 150px;
              max-height: 32px;
            }

            .affiliation-item--relationship { min-width: 224px; }
          }

          @media (prefers-reduced-motion: reduce) {
            .affiliation-marquee {
              overflow-x: auto;
              -webkit-mask-image: none;
              mask-image: none;
            }

            .affiliation-marquee__track {
              width: 100%;
              animation: none;
              transform: none;
            }

            .affiliation-marquee__group {
              width: 100%;
              flex-wrap: wrap;
              justify-content: center;
              padding-right: 0;
            }

            .affiliation-marquee__group[aria-hidden="true"] { display: none; }
          }
          '''
          css_path.write_text(css.rstrip() + css_addition + "\n")

          smoke_path = Path("scripts/smoke-runtime.mjs")
          smoke = smoke_path.read_text()
          marker = '''  const blogNavHref = await page.locator('.site-nav a[href="./blog/"]').getAttribute("href");
          if (blogNavHref !== "./blog/") throw new Error("Main navigation is missing the Blog route");

          await assertSkillIconsContained("desktop");'''
          replacement = '''  const blogNavHref = await page.locator('.site-nav a[href="./blog/"]').getAttribute("href");
          if (blogNavHref !== "./blog/") throw new Error("Main navigation is missing the Blog route");

          const marqueeStructure = await page.evaluate(() => ({
            primaryItems: document.querySelectorAll('.affiliation-marquee__group:not([aria-hidden="true"]) .affiliation-item').length,
            duplicateItems: document.querySelectorAll('.affiliation-marquee__group[aria-hidden="true"] .affiliation-item').length,
            duplicateHidden: document.querySelector('.affiliation-marquee__group[aria-hidden="true"]')?.getAttribute('aria-hidden'),
            animationName: getComputedStyle(document.querySelector('.affiliation-marquee__track')).animationName
          }));
          if (marqueeStructure.primaryItems !== 6) throw new Error(`Expected 6 primary affiliation items, got ${marqueeStructure.primaryItems}`);
          if (marqueeStructure.duplicateItems !== 6) throw new Error(`Expected 6 duplicate affiliation items, got ${marqueeStructure.duplicateItems}`);
          if (marqueeStructure.duplicateHidden !== "true") throw new Error("Duplicate affiliation group is not aria-hidden");
          if (marqueeStructure.animationName !== "affiliation-marquee-right") {
            throw new Error(`Unexpected affiliation marquee animation: ${marqueeStructure.animationName}`);
          }

          const marqueeXBefore = await page.locator('.affiliation-marquee__track').evaluate((element) => element.getBoundingClientRect().x);
          await page.waitForTimeout(300);
          const marqueeXAfter = await page.locator('.affiliation-marquee__track').evaluate((element) => element.getBoundingClientRect().x);
          if (marqueeXAfter <= marqueeXBefore) {
            throw new Error(`Affiliation marquee is not moving right: before=${marqueeXBefore}, after=${marqueeXAfter}`);
          }

          await page.emulateMedia({ reducedMotion: "reduce" });
          const reducedMotion = await page.evaluate(() => ({
            animationName: getComputedStyle(document.querySelector('.affiliation-marquee__track')).animationName,
            duplicateDisplay: getComputedStyle(document.querySelector('.affiliation-marquee__group[aria-hidden="true"]')).display
          }));
          if (reducedMotion.animationName !== "none") throw new Error("Affiliation marquee does not stop for reduced-motion users");
          if (reducedMotion.duplicateDisplay !== "none") throw new Error("Reduced-motion mode still renders the duplicate marquee group");
          await page.emulateMedia({ reducedMotion: "no-preference" });

          await assertSkillIconsContained("desktop");'''
          if marker not in smoke:
              raise SystemExit("Smoke insertion marker not found")
          smoke = smoke.replace(marker, replacement, 1)
          old_log = "skill icons contained at desktop/mobile, expanded project clear of sticky navbar"
          new_log = "affiliation marquee rightward/reduced-motion-safe, skill icons contained at desktop/mobile, expanded project clear of sticky navbar"
          if old_log not in smoke:
              raise SystemExit("Smoke success log marker not found")
          smoke_path.write_text(smoke.replace(old_log, new_log, 1))
          PY

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete validation
        run: npm run validate

      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run Chromium smoke
        run: npm run smoke:runtime

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/style.css assets/i18n/en.json assets/i18n/zh.json scripts/smoke-runtime.mjs
          git commit -m "feat: add affiliation logo marquee"
          git push origin HEAD:agent/issue-38-affiliation-marquee
