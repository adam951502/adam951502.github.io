name: One-time SEO codemod

on:
  push:
    branches:
      - agent/issue-14-seo-v2

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-14-seo-v2

      - name: Apply guarded SEO insertion
        run: node scripts/codemod-seo.mjs

      - name: Commit generated index change
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add portfolio SEO metadata"
          git push
