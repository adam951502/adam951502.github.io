name: Scale affiliation marquee once

on:
  push:
    branches:
      - agent/issue-40-larger-affiliation-logos

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-40-larger-affiliation-logos

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Increase marquee visual scale
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/css/style.css')
          css = path.read_text()

          replacements = [
              ('grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);', 'grid-template-columns: minmax(0, 0.68fr) minmax(0, 1.32fr);'),
              ('animation: affiliation-marquee-right 36s linear infinite;', 'animation: affiliation-marquee-right 42s linear infinite;'),
              ('min-width: 154px;\n  height: 72px;', 'min-width: 184px;\n  height: 88px;'),
              ('max-width: 178px;\n  max-height: 38px;', 'max-width: 215px;\n  max-height: 48px;'),
              ('min-width: 250px;', 'min-width: 292px;'),
              ('font-size: 0.62rem;', 'font-size: 0.66rem;'),
              ('font-size: 1rem;\n  font-weight: 700;', 'font-size: 1.12rem;\n  font-weight: 700;'),
              ('animation-duration: 32s;', 'animation-duration: 38s;'),
              ('min-width: 136px;\n    height: 62px;', 'min-width: 154px;\n    height: 72px;'),
              ('max-width: 150px;\n    max-height: 32px;', 'max-width: 176px;\n    max-height: 38px;'),
              ('min-width: 224px;', 'min-width: 252px;'),
          ]

          for old, new in replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              css = css.replace(old, new, 1)

          path.write_text(css)
          PY

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete validation
        run: npm run validate

      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run Chromium smoke
        run: npm run smoke:runtime

      - name: Commit tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css
          git commit -m "style: enlarge affiliation marquee logos"
          git push origin HEAD:agent/issue-40-larger-affiliation-logos
