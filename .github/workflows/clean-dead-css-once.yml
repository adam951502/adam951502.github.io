name: One-time dead CSS cleanup

on:
  push:
    branches:
      - agent/issue-13-js-modules

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-13-js-modules

      - name: Remove verified dead skill-tree selectors
        run: node scripts/clean-dead-skill-css.mjs

      - name: Validate CSS hygiene
        run: node scripts/validate-css-hygiene.mjs

      - name: Commit CSS cleanup
        run: |
          if git diff --quiet -- assets/css/style.css; then
            echo "No CSS cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css
          git commit -m "refactor: remove legacy skill-tree CSS"
          git push
