      - name: Extend architecture and accessibility validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-js-modules.mjs')
          text = path.read_text()
          text = text.replace('  "app.js",\n  "carousel.js",', '  "app.js",\n  "blog.js",\n  "carousel.js",', 1)
          text = text.replace('  "navigation.js",\n  "projects.js",', '  "navigation.js",\n  "mobile-menu.js",\n  "projects.js",', 1)
          marker = '''for (const modulePath of requiredAppImports) {
            if (!(sources["app.js"] || "").includes(modulePath)) {
              errors.push(`assets/js/app.js must explicitly import ${modulePath}`);
            }
          }
          '''
          replacement = marker + '''
          const requiredBlogImports = ["./i18n.js", "./mobile-menu.js", "./theme.js"];
          for (const modulePath of requiredBlogImports) {
            if (!(sources["blog.js"] || "").includes(modulePath)) {
              errors.push(`assets/js/blog.js must explicitly import ${modulePath}`);
            }
          }
          if (!(sources["navigation.js"] || "").includes('./mobile-menu.js')) {
            errors.push("assets/js/navigation.js must reuse ./mobile-menu.js");
          }
          '''
          if marker not in text:
              raise SystemExit('validate-js-modules app import marker missing')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '  "navigation.js": ["createNavigationController", "highlightSection", "closeMobileMenu"],',
              '  "navigation.js": ["createNavigationController", "highlightSection", "closeMobileMenu"],\n  "mobile-menu.js": ["createMobileMenuController", "restoreFocus", "event.key === \\"Escape\\""],\n  "blog.js": ["createI18nController", "createMobileMenuController", "createThemeController", "../assets/i18n"],',
              1,
          )
          path.write_text(text)

          path = Path('scripts/validate-a11y-runtime.mjs')
          text = path.read_text()
          text = text.replace(
              'const indexHtml = fs.readFileSync("index.html", "utf8");\nconst errors = [];',
              'const indexHtml = fs.readFileSync("index.html", "utf8");\nconst blogHtml = fs.readFileSync("blog/index.html", "utf8");\nconst errors = [];',
              1,
          )
          text = text.replace(
              '  \'event.key === "Escape"\'\n];',
              '  \'event.key === "Escape"\',\n  "createMobileMenuController",\n  "closeMobileMenu({ restoreFocus: true })"\n];',
              1,
          )
          insert = '''
          const requiredBlogFragments = [
            'class="lang-toggle"',
            'class="lang-menu"',
            'data-i18n="blog.title"',
            'data-i18n="blog.empty.title"',
            'data-i18n-aria-label="blog.areasLabel"',
            '<script type="module" src="../assets/js/blog.js"></script>'
          ];
          for (const fragment of requiredBlogFragments) {
            if (!blogHtml.includes(fragment)) errors.push(`Missing Blog accessibility/i18n guard: ${fragment}`);
          }
          if (blogHtml.includes("(() => {")) {
            errors.push("Blog must not maintain a separate inline runtime IIFE");
          }
          '''
          marker = 'if (!translatedMarkupElements.length) {\n  errors.push("Expected translated list markup in index.html but found none");\n}\n'
          if marker not in text:
              raise SystemExit('a11y insertion marker missing')
          text = text.replace(marker, marker + insert, 1)
          text = text.replace(
              'console.log(`Accessibility/runtime validation passed across modules: safe translated markup, action-oriented theme label, keyboard language navigation, ${translatedMarkupElements.length} translated list containers.`);',
              'console.log(`Accessibility/runtime validation passed across portfolio + Blog modules: safe translated markup, action-oriented theme labels, keyboard language/mobile navigation, Blog i18n, ${translatedMarkupElements.length} translated list containers.`);',
              1,
          )
          path.write_text(text)

          path = Path('scripts/validate-seo.mjs')
          text = path.read_text().replace('  `<h1>Blog / Notes</h1>`', '  `data-i18n="blog.title">Blog / Notes</h1>`', 1)
          path.write_text(text)
          PY

      - name: Extend Chromium Blog regression coverage
        run: |
