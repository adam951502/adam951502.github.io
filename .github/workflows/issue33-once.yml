name: One-time Blog runtime consolidation

on:
  push:
    branches:
      - agent/issue-33-blog-shared-runtime

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-33-blog-shared-runtime

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add shared mobile menu module
        run: |
          cat > assets/js/mobile-menu.js <<'JS'
          export function createMobileMenuController({ closeLanguageMenu = () => {} } = {}) {
            const mobileMenuToggle = document.querySelector(".mobile-menu-toggle");
            const siteHeader = document.querySelector(".site-header");
            const mobileMenuQuery = window.matchMedia("(max-width: 1180px)");

            function closeMobileMenu({ restoreFocus = false } = {}) {
              if (!mobileMenuToggle || !siteHeader) return;
              siteHeader.classList.remove("menu-open");
              mobileMenuToggle.setAttribute("aria-expanded", "false");
              const icon = mobileMenuToggle.querySelector("i");
              if (icon) icon.className = "ri-menu-3-line";
              if (restoreFocus) mobileMenuToggle.focus();
            }

            function openMobileMenu() {
              if (!mobileMenuToggle || !siteHeader) return;
              closeLanguageMenu();
              siteHeader.classList.add("menu-open");
              mobileMenuToggle.setAttribute("aria-expanded", "true");
              const icon = mobileMenuToggle.querySelector("i");
              if (icon) icon.className = "ri-close-line";
            }

            function bind() {
              mobileMenuToggle?.addEventListener("click", () => {
                const isOpen = mobileMenuToggle.getAttribute("aria-expanded") === "true";
                if (isOpen) closeMobileMenu();
                else openMobileMenu();
              });

              document.addEventListener("click", (event) => {
                if (siteHeader?.classList.contains("menu-open") && !siteHeader.contains(event.target)) {
                  closeMobileMenu();
                }
              });

              document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && siteHeader?.classList.contains("menu-open")) {
                  closeMobileMenu({ restoreFocus: true });
                }
              });

              mobileMenuQuery.addEventListener("change", (event) => {
                if (!event.matches) closeMobileMenu();
              });
            }

            return { bind, closeMobileMenu, openMobileMenu };
          }
          JS

      - name: Refactor shared navigation and i18n
        run: |
          cat > assets/js/navigation.js <<'JS'
          import { createMobileMenuController } from "./mobile-menu.js";

          export function createNavigationController({ prefersReducedMotion, closeLanguageMenu }) {
            const navLinks = Array.from(document.querySelectorAll(".site-nav a"));
            const brandLink = document.querySelector(".brand");
            const backToTop = document.getElementById("backToTop");
            const siteHeader = document.querySelector(".site-header");
            const siteFooter = document.querySelector(".footer");
            const mobileMenuController = createMobileMenuController({ closeLanguageMenu });
            const { closeMobileMenu } = mobileMenuController;

            const navSections = navLinks
              .map((link) => {
                const selector = link.getAttribute("href");
                if (!selector?.startsWith("#")) return null;
                const target = document.querySelector(selector);
                if (!target) return null;
                return { link, target };
              })
              .filter(Boolean);

            function smoothScrollTo(target) {
              if (!target) return;
              target.scrollIntoView({
                behavior: prefersReducedMotion ? "auto" : "smooth",
                block: "start"
              });
            }

            function highlightSection() {
              const scrollPosition = window.scrollY + 180;
              let activeLink = null;

              navSections.forEach(({ link, target }) => {
                const top = target.offsetTop;
                const bottom = top + target.offsetHeight;
                if (scrollPosition >= top && scrollPosition < bottom) activeLink = link;
              });

              navLinks.forEach((link) => {
                link.classList.toggle("active", link === activeLink);
              });
            }

            function handleScroll() {
              siteHeader?.classList.toggle("scrolled", window.scrollY > 10);
              highlightSection();
              if (backToTop) {
                const footerVisible = siteFooter && siteFooter.getBoundingClientRect().top < window.innerHeight - 12;
                backToTop.hidden = window.scrollY < 260 || footerVisible;
              }
            }

            function bind() {
              navLinks.forEach((link) => {
                link.addEventListener("click", (event) => {
                  const href = link.getAttribute("href") || "";
                  if (!href.startsWith("#")) {
                    closeMobileMenu();
                    return;
                  }

                  event.preventDefault();
                  const target = document.querySelector(href);
                  closeMobileMenu();
                  smoothScrollTo(target);
                });
              });

              brandLink?.addEventListener("click", (event) => {
                event.preventDefault();
                closeMobileMenu();
                smoothScrollTo(document.querySelector("#hero"));
              });

              backToTop?.addEventListener("click", () => {
                window.scrollTo({
                  top: 0,
                  behavior: prefersReducedMotion ? "auto" : "smooth"
                });
              });

              mobileMenuController.bind();
              window.addEventListener("scroll", handleScroll, { passive: true });
            }

            return { bind, closeMobileMenu, handleScroll, highlightSection };
          }
          JS

          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/i18n.js')
          text = path.read_text()
          text = text.replace(
              'export function createI18nController({ onApply }) {\n',
              'export function createI18nController({ onApply = async () => {}, i18nBasePath = "./assets/i18n", pageTitleKey = "page.title" } = {}) {\n',
              1,
          )
          text = text.replace('  const i18nBasePath = "./assets/i18n";\n', '', 1)
          text = text.replace('    const pageTitle = translateFn("page.title");\n', '    const pageTitle = translateFn(pageTitleKey);\n', 1)
          path.write_text(text)
          PY

      - name: Add Blog module
        run: |
          cat > assets/js/blog.js <<'JS'
          import { createI18nController } from "./i18n.js";
          import { createMobileMenuController } from "./mobile-menu.js";
          import { createThemeController } from "./theme.js";

          const themeToggle = document.querySelector(".theme-toggle");
          const themeToggleLabel = document.querySelector(".theme-toggle-label");
          let i18nController;

          const themeController = createThemeController({
            root: document.documentElement,
            themeToggle,
            themeToggleLabel,
            getCurrentLang: () => i18nController?.getCurrentLang() || "en"
          });

          const mobileMenuController = createMobileMenuController({
            closeLanguageMenu: () => i18nController?.closeMenu()
          });

          i18nController = createI18nController({
            i18nBasePath: "../assets/i18n",
            pageTitleKey: "blog.page.title",
            onApply: async ({ translate }) => {
              themeController.setLabel(translate);
            }
          });

          mobileMenuController.bind();
          themeController.bind();
          i18nController.bind();
          themeController.applyInitial();
          i18nController.applyTranslations(i18nController.getCurrentLang());
          JS

