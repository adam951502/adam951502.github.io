name: Validate portfolio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate structured content and runtime architecture
        run: npm run validate

      - name: Check JavaScript module syntax
        run: |
          find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Smoke test browser runtime
        run: npm run smoke:runtime

      - name: Verify default GitHub Pages domain
        run: |
          test ! -f CNAME
          ! grep -R "adam-tang.com" index.html robots.txt sitemap.xml scripts assets/data assets/js
