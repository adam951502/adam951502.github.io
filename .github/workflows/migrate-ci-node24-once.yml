name: One-time CI Node 24 migration

on:
  push:
    branches:
      - agent/issues-31-32-ci-node24-lockfile

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/issues-31-32-ci-node24-lockfile

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Update validation docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = 'Install the validation dependency and run the complete validation suite with:\n\n```bash\nnpm install\nnpm run validate\n```'
          new = 'Install the exact committed validation dependency graph and run the complete validation suite with:\n\n```bash\nnpm ci --ignore-scripts\nnpm run validate\n```\n\n`package-lock.json` is committed so local and CI validation resolve the same transitive dependency versions.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one README install block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full validation on Node 24
        run: |
          npm run validate
          find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          npm run smoke:runtime
          test ! -f CNAME
          ! grep -R "adam-tang.com" index.html robots.txt sitemap.xml scripts assets/data assets/js

      - name: Commit lockfile and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md
          git commit -m "build: lock validation dependencies"
          git pull --rebase origin agent/issues-31-32-ci-node24-lockfile
          git push
