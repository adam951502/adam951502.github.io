name: Freeze affiliation marquee at 140 once

on:
  push:
    branches:
      - agent/freeze-affiliation-140

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/freeze-affiliation-140
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply final 140% design
        run: python3 scripts/tmp-freeze-affiliation-140.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run validate
      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Chromium smoke
        run: npm run smoke:runtime
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: freeze affiliation marquee at 140 percent"
          git push origin HEAD:agent/freeze-affiliation-140
