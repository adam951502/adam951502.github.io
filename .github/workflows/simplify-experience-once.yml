name: Simplify Experience timeline once

on:
  push:
    branches:
      - agent/simplify-experience-timeline

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/simplify-experience-timeline
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore pre-overview Experience presentation
        run: |
          git checkout 26a6edff0b79b0ed6431709759a0c42933c7168b -- \
            assets/css/style.css \
            assets/i18n/en.json \
            assets/i18n/zh.json \
            assets/js/experience.js \
            index.html \
            scripts/build-content.mjs \
            scripts/smoke-runtime.mjs
      - name: Apply simple career span
        run: python3 scripts/tmp-simplify-experience.py
      - name: Build generated fallback
        run: npm run build:content
      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run validate
      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Chromium smoke
        run: npm run smoke:runtime
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css assets/i18n/en.json assets/i18n/zh.json assets/js/experience.js index.html scripts/build-content.mjs scripts/smoke-runtime.mjs
          git commit -m "fix: simplify Experience timeline header"
          git push origin HEAD:agent/simplify-experience-timeline
