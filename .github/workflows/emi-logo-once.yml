name: Import Fraunhofer EMI logo once

on:
  push:
    branches:
      - agent/heraklion-official-logo

permissions:
  contents: write

jobs:
  import-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/heraklion-official-logo

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download and verify official Fraunhofer EMI logo
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.heraklion-projekt.de/wp-content/uploads/2023/08/logo-emi.png' \
            -o assets/images/logo-emi.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/images/logo-emi.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Downloaded Fraunhofer EMI asset is not a PNG')
          if len(data) > 2 * 1024 * 1024:
              raise SystemExit(f'Fraunhofer EMI logo unexpectedly large: {len(data)} bytes')
          width = int.from_bytes(data[16:20], 'big')
          height = int.from_bytes(data[20:24], 'big')
          print(f'Fraunhofer EMI logo: {width}x{height}, {len(data)} bytes')
          PY

      - name: Replace marquee EMI asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index_path = Path('index.html')
          html = index_path.read_text()
          old = 'assets/images/emi-color.svg'
          if html.count(old) != 2:
              raise SystemExit(f'Expected two marquee EMI references, found {html.count(old)}')
          index_path.write_text(html.replace(old, 'assets/images/logo-emi.png'))

          smoke_path = Path('scripts/smoke-runtime.mjs')
          smoke = smoke_path.read_text()
          marker = '  if (heraklionSrc !== "assets/images/logo-heraklion.gif") throw new Error(`Unexpected HERAKLION logo source: ${heraklionSrc}`);\n'
          addition = marker + '''\n  const emiLogo = page.locator('.affiliation-marquee__group:not([aria-hidden="true"]) img[alt="Fraunhofer EMI"]');\n  if (await emiLogo.count() !== 1) throw new Error("Official Fraunhofer EMI logo is missing from the primary affiliation group");\n  const emiSrc = await emiLogo.getAttribute("src");\n  if (emiSrc !== "assets/images/logo-emi.png") throw new Error(`Unexpected Fraunhofer EMI logo source: ${emiSrc}`);\n'''
          if marker not in smoke:
              raise SystemExit('HERAKLION smoke marker not found')
          smoke_path.write_text(smoke.replace(marker, addition, 1))
          PY

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete validation
        run: npm run validate

      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run Chromium smoke
        run: npm run smoke:runtime

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo-emi.png index.html scripts/smoke-runtime.mjs
          git commit -m "feat: use official Fraunhofer EMI logo"
          git push origin HEAD:agent/heraklion-official-logo
