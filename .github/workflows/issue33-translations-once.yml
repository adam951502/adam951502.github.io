name: One-time Blog translations validation

on:
  push:
    branches:
      - agent/issue-33-blog-shared-runtime

permissions:
  contents: write

jobs:
  translate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-33-blog-shared-runtime

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add Blog translations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert(path, anchor, block):
              text = path.read_text()
              if '"blog.page.title"' in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected one anchor in {path}, got {text.count(anchor)}")
              path.write_text(text.replace(anchor, block, 1))

          insert(
              Path('assets/i18n/en.json'),
              '  "nav.blog": "Blog",\n  "nav.contact": "Contact",',
              '''  "nav.blog": "Blog",
  "blog.page.title": "Blog / Notes — Adam Tang",
  "blog.nav.portfolio": "Portfolio",
  "blog.nav.blog": "Blog",
  "blog.github": "GitHub",
  "blog.eyebrow": "Engineering notes",
  "blog.title": "Blog / Notes",
  "blog.lede": "A home for practical write-ups on GenAI, data systems, software engineering, project delivery, and lessons from building real products.",
  "blog.areasLabel": "Planned writing areas",
  "blog.area.genai": "GenAI",
  "blog.area.data": "Data & Knowledge",
  "blog.area.engineering": "Engineering",
  "blog.area.product": "Product Delivery",
  "blog.back": "Back to portfolio",
  "blog.viewGithub": "View GitHub",
  "blog.status.label": "Publishing status",
  "blog.status.value": "Landing page live",
  "blog.policy.label": "Content policy",
  "blog.policy.value": "Only finished, authored notes appear here—no placeholder articles.",
  "blog.latest.eyebrow": "Latest notes",
  "blog.latest.title": "Writing starts with real content",
  "blog.latest.note": "The route, navigation, SEO, theme, and responsive shell are ready for the first published article.",
  "blog.empty.pill": "Empty state",
  "blog.empty.title": "No posts published yet",
  "blog.empty.body": "No article titles, dates, or summaries are being fabricated from old template assets. Real posts can be added here when their content is ready.",
  "blog.empty.action": "Explore projects instead",
  "blog.footer": "Adam Tang · Blog / Notes",
  "nav.contact": "Contact",'''
          )

          insert(
              Path('assets/i18n/zh.json'),
              '  "nav.blog": "部落格",\n  "nav.contact": "聯絡",',
              '''  "nav.blog": "部落格",
  "blog.page.title": "部落格 / 筆記 — Adam Tang",
  "blog.nav.portfolio": "作品集",
  "blog.nav.blog": "部落格",
  "blog.github": "GitHub",
  "blog.eyebrow": "工程筆記",
  "blog.title": "部落格 / 筆記",
  "blog.lede": "記錄生成式 AI、資料系統、軟體工程、專案交付，以及打造真實產品過程中的實務經驗與反思。",
  "blog.areasLabel": "預計撰寫主題",
  "blog.area.genai": "生成式 AI",
  "blog.area.data": "資料與知識工程",
  "blog.area.engineering": "工程實作",
  "blog.area.product": "產品交付",
  "blog.back": "返回作品集",
  "blog.viewGithub": "查看 GitHub",
  "blog.status.label": "發布狀態",
  "blog.status.value": "部落格首頁已上線",
  "blog.policy.label": "內容原則",
  "blog.policy.value": "只發布完成且由本人撰寫的筆記，不使用佔位文章。",
  "blog.latest.eyebrow": "最新筆記",
  "blog.latest.title": "從真實內容開始",
  "blog.latest.note": "路由、導覽、SEO、主題與響應式頁面已準備好，等待第一篇正式文章。",
  "blog.empty.pill": "目前狀態",
  "blog.empty.title": "尚未發布文章",
  "blog.empty.body": "不會從舊模板圖片捏造文章標題、日期或摘要；正式內容完成後才會在此發布。",
  "blog.empty.action": "先看看專案",
  "blog.footer": "Adam Tang · 部落格 / 筆記",
  "nav.contact": "聯絡",'''
          )
          PY

      - name: Run complete validation
        run: |
          npm run validate
          find assets/js -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          npm run smoke:runtime
          test ! -f CNAME
          ! grep -R "adam-tang.com" index.html blog robots.txt sitemap.xml scripts assets/data assets/js

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n/en.json assets/i18n/zh.json
          git commit -m "feat: add bilingual Blog shell translations"
          git pull --rebase origin agent/issue-33-blog-shared-runtime
          git push
