name: One-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/affiliation-scale-control'
            'agent/current-career-span'
            'agent/experience-alternating-timeline'
            'agent/experience-overview-timeline'
            'agent/freelance-ai-projects'
            'agent/freeze-affiliation-140'
            'agent/heraklion-official-logo'
            'agent/issue-1-skill-icon-containment'
            'agent/issue-2-project-navbar-regression'
            'agent/issue-5-blog-landing-page'
            'agent/issue-9-media-optimization'
            'agent/issue-12-schema-validation'
            'agent/issue-13-js-modules'
            'agent/issue-14-seo'
            'agent/issue-14-seo-v2'
            'agent/issue-15-a11y-i18n'
            'agent/issue-16-repo-hygiene'
            'agent/issue-25-restore-github-pages-domain'
            'agent/issue-33-blog-shared-runtime'
            'agent/issue-34-remove-legacy-blog-assets'
            'agent/issue-38-affiliation-marquee'
            'agent/issue-40-larger-affiliation-logos'
            'agent/issues-10-11-build-content'
            'agent/issues-31-32-ci-node24-lockfile'
            'agent/recruiter-first-ux'
            'agent/simplify-experience-timeline'
            'agent/technical-cleanup-p1'
            'codex/update-recent-projects-cv-2026'
            'dev'
            'maintenance/cleanup-stale-branches'
          )

          for branch in "${branches[@]}"; do
            encoded_ref=$(python3 - "$branch" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote('heads/' + sys.argv[1], safe=''))
PY
)
            status=$(curl -sS -o /tmp/delete-response.txt -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/${encoded_ref}")

            if [[ "$status" == '204' ]]; then
              echo "Deleted: $branch"
            elif [[ "$status" == '404' || "$status" == '422' ]]; then
              echo "Already absent or not deletable: $branch ($status)"
            else
              echo "Failed: $branch ($status)"
              cat /tmp/delete-response.txt
              exit 1
            fi
          done
