name: Clean accidental node modules once

on:
  push:
    branches:
      - agent/freeze-affiliation-140

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/freeze-affiliation-140
      - name: Remove accidental dependency artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r node_modules
          git commit -m "chore: remove accidental node_modules"
          git push origin HEAD:agent/freeze-affiliation-140
